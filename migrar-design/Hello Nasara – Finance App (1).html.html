<!doctype html>
<html lang="pt-AO">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>AB Finance – Protótipo</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #ededed;
                --panel: #fff;
                --text: #0d0d0d;
                --muted: #8d8d8d;
                --circ: #efefef;
                --acc: #9c32d7;
                --amb: #ffd35b;
                --hbtn: #fff;
                --ring: #dedede;
                --neg: #d9423b;
                --pos: #1f9d57;
                --add: #000;
                --addc: #fff;
                --addp: #000;
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #000;
                    --panel: #141414;
                    --text: #fff;
                    --muted: #7a7a7a;
                    --circ: #000;
                    --hbtn: #262626;
                    --ring: #262626;
                    --add: #1d1d1d;
                    --addc: #333;
                    --addp: #fff;
                    color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --bg: #000;
                --panel: #141414;
                --text: #fff;
                --muted: #7a7a7a;
                --circ: #000;
                --hbtn: #262626;
                --ring: #262626;
                --add: #1d1d1d;
                --addc: #333;
                --addp: #fff;
                color-scheme: dark;
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                min-height: 100vh;
                font-family: Poppins, system-ui, sans-serif;
                background: linear-gradient(#ebebeb, #5d5d5d) fixed;
                color: var(--text);
                display: flex;
                justify-content: center;
                padding: 10px;
            }
            button {
                font-family: inherit;
                border: 0;
                cursor: pointer;
                color: inherit;
                -webkit-tap-highlight-color: transparent;
            }
            svg {
                width: 20px;
                height: 20px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.6;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: none;
            }
            .app {
                position: relative;
                width: 100%;
                max-width: 430px;
                height: calc(100dvh - 20px);
                min-height: 560px;
                background: var(--bg);
                border-radius: 30px;
                overflow: hidden;
                transition: background 0.3s;
            }
            .scroll {
                height: 100%;
                overflow-y: auto;
                padding: 20px 18px 120px;
                scrollbar-width: none;
            }
            .scroll::-webkit-scrollbar {
                display: none;
            }
            .top {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .circ {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                background: var(--hbtn);
                display: grid;
                place-items: center;
                transition: transform 0.15s;
            }
            .circ:active {
                transform: scale(0.92);
            }
            .rt {
                display: flex;
                gap: 7px;
            }
            .av {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                background: #111;
                color: #fff;
                display: grid;
                place-items: center;
                font-weight: 600;
                font-size: 16px;
                padding: 0;
                position: relative;
                flex: none;
                transition: transform 0.15s;
            }
            .av:active {
                transform: scale(0.92);
            }
            .av img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                border-radius: 50%;
            }
            .av.big {
                width: 72px;
                height: 72px;
                font-size: 26px;
                cursor: pointer;
            }
            .av.big::after {
                content: "+";
                position: absolute;
                right: 0;
                bottom: 0;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: var(--acc);
                color: #fff;
                font-size: 15px;
                display: grid;
                place-items: center;
                border: 2px solid var(--panel);
            }
            .av.lg {
                width: 58px;
                height: 58px;
                font-size: 22px;
            }
            .pf {
                display: flex;
                align-items: center;
                gap: 16px;
            }
            .pn {
                flex: 1;
                min-width: 0;
            }
            .pn small {
                font-size: 10px;
                color: var(--muted);
            }
            .in.nm {
                font-size: 20px;
                margin: 0;
                padding: 4px 0;
            }
            h1 {
                font-size: 27px;
                line-height: 34px;
                font-weight: 500;
                letter-spacing: -0.4px;
                margin-top: 16px;
            }
            .sub {
                font-size: 12px;
                color: var(--muted);
                margin-top: 3px;
            }
            .stack {
                position: relative;
                margin-top: 16px;
            }
            .sal {
                background: var(--amb);
                color: #111;
                border-radius: 24px;
                height: 100px;
                padding: 20px 18px 0 16px;
                display: flex;
                justify-content: space-between;
                font-size: 14px;
                cursor: pointer;
            }
            .mc {
                display: flex;
                align-items: center;
            }
            .mc i {
                width: 13px;
                height: 13px;
                border-radius: 50%;
                background: #111;
            }
            .mc i + i {
                margin-left: -5px;
                border: 1.5px solid var(--amb);
                width: 14.5px;
                height: 14.5px;
            }
            .main {
                background: var(--acc);
                color: #fff;
                border-radius: 24px;
                padding: 20px 20px 72px;
                position: relative;
                overflow: hidden;
            }
            .stack.has .main {
                margin-top: -47px;
            }
            .notch {
                position: absolute;
                right: 0;
                bottom: 0;
                width: 128px;
                height: 56px;
                background: var(--bg);
                border-top-left-radius: 24px;
                transition: background 0.3s;
            }
            .notch::before,
            .notch::after {
                content: "";
                position: absolute;
                width: 24px;
                height: 24px;
                border-bottom-right-radius: 24px;
                box-shadow: 12px 12px 0 12px var(--bg);
            }
            .notch::before {
                left: -24px;
                bottom: 0;
            }
            .notch::after {
                right: 0;
                top: -24px;
            }
            .add {
                position: absolute;
                right: 0;
                bottom: 0;
                width: 120px;
                height: 50px;
                border-radius: 25px;
                background: var(--add);
                color: #fff;
                display: flex;
                align-items: center;
                gap: 8px;
                padding-left: 9px;
                font-size: 13px;
                font-weight: 500;
            }
            .add span {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: var(--addc);
                color: var(--addp);
                display: grid;
                place-items: center;
                font-size: 22px;
                font-weight: 400;
                line-height: 1;
            }
            .lbl {
                font-size: 12px;
                opacity: 0.85;
            }
            .big {
                font-size: 33px;
                font-weight: 500;
                letter-spacing: -0.6px;
                line-height: 44px;
                cursor: pointer;
            }
            .big small {
                font-size: 16px;
                font-weight: 400;
                opacity: 0.8;
            }
            .io {
                display: flex;
                gap: 10px;
                margin-top: 12px;
            }
            .io div {
                flex: 1;
                background: #ffffff22;
                border-radius: 16px;
                padding: 9px 12px;
                font-size: 11px;
            }
            .io b {
                display: block;
                font-size: 14px;
                font-weight: 500;
                margin-top: 2px;
            }
            .panel {
                background: var(--panel);
                border-radius: 28px;
                padding: 18px 14px;
                margin-top: 16px;
                transition: background 0.3s;
            }
            .quick {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 14px 0;
                padding: 18px 4px;
            }
            .q {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                font-size: 11px;
                background: none;
            }
            .q .circ {
                width: 52px;
                height: 52px;
                background: var(--circ);
            }
            .q.p .circ {
                background: var(--acc);
                color: #fff;
            }
            .eh {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 14px;
                font-weight: 500;
                margin-bottom: 6px;
            }
            .eh button {
                background: none;
                font-size: 11px;
                color: var(--muted);
            }
            .it {
                display: flex;
                align-items: center;
                gap: 11px;
                min-height: 54px;
                padding: 6px 4px;
                border-radius: 14px;
            }
            .it .circ {
                width: 36px;
                height: 36px;
                background: var(--circ);
            }
            .it .circ svg {
                width: 17px;
                height: 17px;
            }
            .t {
                flex: 1;
                font-size: 13px;
                font-weight: 500;
            }
            .t small {
                display: block;
                font-size: 10px;
                color: var(--muted);
                font-weight: 400;
            }
            .p {
                font-size: 13px;
                font-weight: 500;
                white-space: nowrap;
            }
            .p.n {
                color: var(--neg);
            }
            .p.g {
                color: var(--pos);
            }
            .bar {
                height: 8px;
                border-radius: 8px;
                background: var(--circ);
                margin-top: 6px;
                overflow: hidden;
            }
            .bar i {
                display: block;
                height: 100%;
                background: var(--acc);
                border-radius: 8px;
                transition: width 0.5s;
            }
            .bar.a i {
                background: var(--amb);
            }
            .row {
                padding: 10px 4px;
            }
            .row .h {
                display: flex;
                justify-content: space-between;
                font-size: 13px;
                font-weight: 500;
            }
            .row small {
                font-size: 10px;
                color: var(--muted);
            }
            .back {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 20px;
                font-weight: 500;
                margin-bottom: 4px;
            }
            .empty {
                text-align: center;
                padding: 26px 10px;
                font-size: 12px;
                color: var(--muted);
            }
            .empty button {
                margin-top: 12px;
                background: var(--acc);
                color: #fff;
                padding: 9px 18px;
                border-radius: 99px;
                font-size: 12px;
            }
            .tg {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 4px;
                font-size: 13px;
            }
            .tg small {
                display: block;
                font-size: 10px;
                color: var(--muted);
            }
            .sw {
                width: 44px;
                height: 26px;
                border-radius: 99px;
                background: var(--ring);
                position: relative;
                transition: background 0.2s;
                flex: none;
            }
            .sw::after {
                content: "";
                position: absolute;
                top: 3px;
                left: 3px;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: #fff;
                transition: transform 0.2s;
            }
            .sw.on {
                background: var(--acc);
            }
            .sw.on::after {
                transform: translateX(18px);
            }
            .seg {
                display: flex;
                background: var(--circ);
                border-radius: 99px;
                padding: 3px;
                gap: 3px;
            }
            .seg button {
                flex: 1;
                background: none;
                padding: 8px;
                border-radius: 99px;
                font-size: 12px;
                color: var(--muted);
            }
            .seg button.on {
                background: var(--acc);
                color: #fff;
            }
            .nav {
                position: absolute;
                left: 50%;
                bottom: calc(16px + env(safe-area-inset-bottom, 0px));
                transform: translateX(-50%);
                display: flex;
                gap: 6px;
                padding: 6px;
                border-radius: 99px;
                background: #000;
                box-shadow: 0 0 0 1px #2a2f2c;
            }
            .nav button {
                width: 43px;
                height: 43px;
                border-radius: 99px;
                background: #262b28;
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 13px;
                font-weight: 500;
                white-space: nowrap;
                transition:
                    background 0.25s,
                    color 0.25s;
            }
            .nav .lb {
                max-width: 0;
                opacity: 0;
                overflow: hidden;
                transition:
                    max-width 0.25s,
                    opacity 0.2s,
                    margin 0.25s;
            }
            .nav .act {
                width: auto;
                background: #fff;
                color: #000;
                padding: 0 16px 0 11px;
            }
            .nav .act .lb {
                max-width: 90px;
                opacity: 1;
                margin-left: 8px;
            }
            .ov {
                position: absolute;
                inset: 0;
                background: #0007;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s;
                z-index: 10;
            }
            .ov.on {
                opacity: 1;
                pointer-events: auto;
            }
            .sh {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                background: var(--panel);
                border-radius: 28px 28px 0 0;
                padding: 10px 22px 24px;
                transform: translateY(100%);
                transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            .ov.on .sh {
                transform: none;
            }
            .grab {
                display: block;
                width: 40px;
                height: 4px;
                border-radius: 4px;
                background: var(--ring);
                margin: 0 auto 14px;
            }
            .sh h2 {
                font-size: 18px;
                font-weight: 600;
                margin-bottom: 12px;
            }
            .in {
                width: 100%;
                border: 0;
                border-bottom: 1.5px solid var(--ring);
                background: none;
                color: var(--text);
                font:
                    500 16px Poppins,
                    sans-serif;
                padding: 10px 0;
                margin-top: 10px;
                outline: 0;
            }
            .in.v {
                font-size: 30px;
            }
            .go {
                width: 100%;
                height: 50px;
                margin-top: 18px;
                border-radius: 25px;
                background: var(--acc);
                color: #fff;
                font-size: 14px;
                font-weight: 500;
            }
            .toast {
                position: absolute;
                left: 50%;
                bottom: 92px;
                transform: translate(-50%, 14px);
                background: var(--text);
                color: var(--bg);
                font-size: 12px;
                font-weight: 500;
                padding: 10px 16px;
                border-radius: 99px;
                opacity: 0;
                pointer-events: none;
                transition:
                    opacity 0.25s,
                    transform 0.25s;
                z-index: 20;
                white-space: nowrap;
            }
            .toast.on {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            .note {
                font-size: 10px;
                color: var(--muted);
                text-align: center;
                margin-top: 16px;
            }
            .dr {
                position: absolute;
                inset: 0;
                background: #0007;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s;
                z-index: 15;
            }
            .dr.on {
                opacity: 1;
                pointer-events: auto;
            }
            .dp {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 86%;
                max-width: 330px;
                background: var(--panel);
                padding: 30px 16px 20px;
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
                overflow-y: auto;
            }
            .dr.on .dp {
                transform: none;
            }
            .dh {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 6px 6px 22px;
            }
            .dh b {
                display: block;
                font-size: 17px;
                font-weight: 600;
            }
            .dh small {
                font-size: 11px;
                color: var(--muted);
            }
            .dh .x {
                margin-left: auto;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: var(--circ);
                display: grid;
                place-items: center;
                font-size: 20px;
                line-height: 1;
                flex: none;
            }
            .dh .x svg {
                width: 18px;
                height: 18px;
            }
            .tgrid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .tc {
                background: var(--circ);
                border-radius: 20px;
                padding: 14px;
                text-align: left;
                display: flex;
                flex-direction: column;
                gap: 12px;
                min-height: 128px;
                transition: transform 0.15s;
            }
            .tc:active {
                transform: scale(0.97);
            }
            .tc .circ {
                width: 40px;
                height: 40px;
                background: var(--panel);
            }
            .tc b {
                font-size: 13px;
                font-weight: 500;
                display: block;
                line-height: 1.25;
            }
            .tc small {
                font-size: 10px;
                color: var(--muted);
                display: block;
                margin-top: 2px;
            }
            .fl {
                display: block;
                font-size: 10px;
                color: var(--muted);
                margin-top: 14px;
            }
            .dp .in {
                font-size: 18px;
                margin-top: 2px;
            }
            #tr {
                margin-top: 20px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .dc {
                background: var(--acc);
                color: #fff;
                border-radius: 22px;
                padding: 16px;
            }
            .dc .l {
                font-size: 11px;
                opacity: 0.85;
            }
            .dc .r {
                font-size: 26px;
                font-weight: 500;
                letter-spacing: -0.5px;
                line-height: 36px;
            }
            .dg {
                background: var(--circ);
                border-radius: 18px;
                padding: 12px 14px;
            }
            .dg .row {
                padding: 6px 0;
            }
            .dg .bar {
                background: var(--panel);
            }
            .view {
                animation: in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            @keyframes in {
                from {
                    opacity: 0;
                    transform: translateX(14px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    animation: none !important;
                    transition: none !important;
                }
            }
            @media (min-width: 521px) {
                .app {
                    border: 12px solid #0b0b0b;
                    border-radius: 58px;
                    box-shadow:
                        0 0 0 4px #3f4a45,
                        0 40px 70px #0006;
                    max-width: 430px;
                    height: min(860px, calc(100dvh - 20px));
                }
                .scroll {
                    padding-top: 36px;
                }
            }
            select.in {
                appearance: none;
                -webkit-appearance: none;
                border-radius: 0;
            }
            .srch {
                display: flex;
                align-items: center;
                gap: 10px;
                background: var(--circ);
                border-radius: 99px;
                padding: 0 14px;
                height: 46px;
            }
            .srch svg {
                color: var(--muted);
            }
            .sin {
                flex: 1;
                min-width: 0;
                border: 0;
                background: none;
                outline: 0;
                color: var(--text);
                font:
                    400 13px Poppins,
                    sans-serif;
            }
            .dtr {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-top: 10px;
                font-size: 12px;
                color: var(--muted);
            }
            .dti {
                flex: 1;
                min-width: 0;
                border: 0;
                background: var(--circ);
                color: var(--text);
                border-radius: 99px;
                height: 40px;
                padding: 0 14px;
                font:
                    400 13px Poppins,
                    sans-serif;
                outline: 0;
            }
            .clr {
                background: none;
                color: var(--acc);
                font-size: 12px;
                font-weight: 500;
                padding: 6px;
            }
            .cf {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                scrollbar-width: none;
                margin: 10px -2px 0;
                padding: 2px;
            }
            .cf::-webkit-scrollbar {
                display: none;
            }
            .cf button {
                flex: none;
                padding: 8px 14px;
                border-radius: 99px;
                background: var(--circ);
                font-size: 11px;
                color: var(--muted);
                white-space: nowrap;
            }
            .cf button.on {
                background: var(--acc);
                color: #fff;
            }
            .sm {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                font-size: 11px;
                color: var(--muted);
                margin: 14px 6px 0;
            }
            .hs {
                background: var(--acc);
                color: #fff;
                border-radius: 26px;
                padding: 18px 18px 16px;
                margin-top: 16px;
            }
            .hs .l {
                font-size: 11px;
                opacity: 0.85;
            }
            .hs .r {
                font-size: 30px;
                font-weight: 500;
                letter-spacing: -0.6px;
                line-height: 42px;
            }
            .hs .pb {
                height: 6px;
                border-radius: 6px;
                background: #ffffff33;
                margin-top: 12px;
                overflow: hidden;
            }
            .hs .pb i {
                display: block;
                height: 100%;
                background: var(--amb);
                border-radius: 6px;
                transition: width 0.4s;
            }
            .hs .io {
                margin-top: 12px;
            }
            .ftg {
                display: flex;
                align-items: center;
                gap: 8px;
                width: 100%;
                margin-top: 10px;
                padding: 10px 14px;
                border-radius: 99px;
                background: var(--circ);
                font-size: 12px;
                color: var(--text);

                z-index: 50;
            }
            .lk {
                overflow: hidden;
                animation: lkin 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            .lk > * {
                position: relative;
            }
            .lk > .bl {
                position: absolute;
            }
            @keyframes lkin {
                from {
                    opacity: 0;
                    transform: scale(1.07);
                    filter: blur(12px);
                }
                to {
                    opacity: 1;
                    transform: none;
                    filter: none;
                }
            }
            .lk.out {
                animation: lkout 0.85s cubic-bezier(0.4, 0, 0.2, 1) forwards;
                pointer-events: none;
            }
            @keyframes lkout {
                40% {
                    opacity: 1;
                }
                to {
                    opacity: 0;
                    transform: scale(1.2);
                    filter: blur(16px);
                }
            }
            .bl {
                border-radius: 50%;
                filter: blur(60px);
                opacity: 0.5;
                animation: fl 9s ease-in-out infinite alternate;
            }
            .b1 {
                width: 260px;
                height: 260px;
                background: var(--acc);
                top: -70px;
                left: -80px;
            }
            .b2 {
                width: 220px;
                height: 220px;
                background: var(--amb);
                bottom: -60px;
                right: -70px;
                animation-delay: -4s;
                opacity: 0.4;
            }
            @keyframes fl {
                to {
                    transform: translate(40px, 30px) scale(1.15);
                }
            }
            .lc {
                text-align: center;
                margin-bottom: 8px;
            }
            .clk {
                font-size: 56px;
                font-weight: 500;
                letter-spacing: -2px;
                line-height: 1;
            }
            .dt {
                font-size: 12px;
                color: var(--muted);
                margin-top: 8px;
            }
            .lav {
                margin-top: 22px;
            }
            .lav::before,
            .lav::after {
                content: "";
                position: absolute;
                inset: -6px;
                border-radius: 50%;
                border: 1.5px solid var(--acc);
                animation: rg 2.8s ease-out infinite;
                opacity: 0;
            }
            .lav::after {
                animation-delay: 1.4s;
            }
            @keyframes rg {
                from {
                    transform: scale(0.9);
                    opacity: 0.7;
                }
                to {
                    transform: scale(1.8);
                    opacity: 0;
                }
            }
            .lk .rv {
                opacity: 0;
                transform: translateY(16px);
                animation: rv 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
                animation-delay: calc(0.2s + var(--i) * 0.05s);
            }
            @keyframes rv {
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            .pd.ok i {
                background: var(--pos);
                border-color: var(--pos);
                animation: pop 0.45s;
            }
            @keyframes pop {
                50% {
                    transform: scale(1.6);
                }
            }
            .onb {
                position: absolute;
                inset: 0;
                z-index: 25;
                background: var(--bg);
                display: flex;
                flex-direction: column;
                padding: calc(22px + env(safe-area-inset-top, 0px)) 22px 24px;
                transition:
                    opacity 0.5s,
                    transform 0.5s;
            }
            .onb.out {
                opacity: 0;
                transform: scale(1.05);
                pointer-events: none;
            }
            .ob-top {
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 46px;
            }
            .ob-p {
                flex: 1;
                display: flex;
                gap: 6px;
            }
            .ob-p i {
                flex: 1;
                height: 4px;
                border-radius: 4px;
                background: var(--ring);
                transition: background 0.3s;
            }
            .ob-p i.on {
                background: var(--acc);
            }
            .ob-b {
                flex: 1;
                overflow-y: auto;
                padding-top: 22px;
                scrollbar-width: none;
            }
            .ob-b h1 {
                margin-top: 0;
            }
            .oc {
                display: flex;
                align-items: center;
                gap: 14px;
                width: 100%;
                text-align: left;
                background: var(--panel);
                border-radius: 22px;
                padding: 16px;
                margin-top: 12px;
                border: 2px solid transparent;
                font-size: 14px;
                font-weight: 500;
                transition: border-color 0.2s;
            }
            .oc small {
                display: block;
                font-size: 11px;
                color: var(--muted);
                font-weight: 400;
            }
            .oc.on {
                border-color: var(--acc);
            }
            .oc .circ {
                width: 46px;
                height: 46px;
                background: var(--circ);
            }
            .onb .in {
                background: var(--panel);
                border: 0;
                border-radius: 16px;
                padding: 14px 16px;
                margin-top: 10px;
                font-size: 15px;
            }
            .okc {
                width: 96px;
                height: 96px;
                border-radius: 50%;
                background: var(--acc);
                color: #fff;
                display: grid;
                place-items: center;
                margin: 0 auto 22px;
                animation: pop2 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
            }
            @keyframes pop2 {
                from {
                    transform: scale(0.4);
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="app">
            <div class="scroll" id="view"></div>
            <div class="nav" id="nav"></div>
            <div class="ov" id="ov">
                <div class="sh">
                    <i class="grab"></i>
                    <h2>Novo movimento</h2>
                    <div class="seg" id="seg">
                        <button data-k="r">Receita</button
                        ><button data-k="d" class="on">Despesa</button>
                    </div>
                    <input
                        class="in v"
                        id="vl"
                        inputmode="none"
                        readonly
                        data-num="1"
                        placeholder="0 Kz"
                        aria-label="Valor em Kz"
                    />
                    <input
                        class="in"
                        id="ds"
                        placeholder="Descrição (ex.: Supermercado)"
                        aria-label="Descrição"
                    />
                    <input type="hidden" id="ct" value="Outros" />
                    <div
                        class="cg"
                        id="cg"
                        role="radiogroup"
                        aria-label="Categoria"
                    ></div>
                    <input class="in" id="dd" type="date" aria-label="Data" />
                    <button class="go" id="go">Guardar movimento</button>
                </div>
            </div>
            <div class="ov" id="o2" style="z-index: 12">
                <div class="sh" id="s2"></div>
            </div>
            <div class="dr" id="dr"><div class="dp" id="dp"></div></div>
            <div class="toast" id="toast"></div>
        </div>
        <script>
            var $ = function (i) {
                return document.getElementById(i);
            };
            var IC = {
                home: '<path d="M4 11l8-7 8 7v8H4z"/><path d="M10 19v-5h4v5"/>',
                list: '<path d="M5 7h14M5 12h14M5 17h9"/>',
                goal: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.500"/>',
                stat: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 16v-4M12 16V8M15 16v-3"/>',
                set: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M5.600 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/>',
                plus: '<path d="M12 6v12M6 12h12"/>',
                minus: '<path d="M6 12h12"/>',
                debt: '<rect x="3" y="6" width="18" height="12" rx="3"/><path d="M3 10h18"/>',
                proj: '<path d="M4 8l8-4 8 4-8 4zM4 12l8 4 8-4M4 16l8 4 8-4"/>',
                fix: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
                back: '<path d="M15 5l-7 7 7 7"/>',
                menu: '<path d="M5 8h14M5 12h9M5 16h14"/>',
                more: '<circle cx="6" cy="12" r="1.200"/><circle cx="12" cy="12" r="1.200"/><circle cx="18" cy="12" r="1.200"/>',
                bell: '<path d="M6 16v-5a6 6 0 0112 0v5l1.500 2h-15zM10 20.500a2 2 0 004 0"/>',
            };
            function ic(k) {
                return '<svg viewBox="0 0 24 24">' + IC[k] + "</svg>";
            }
            function kz(n) {
                return (
                    Math.round(n)
                        .toString()
                        .replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Kz"
                );
            }
            // Estado (dados de exemplo)
            var S = {
                name: "Aquiles",
                photo: "",
                base: 412500,
                hid: false,
                mod: {
                    salario: true,
                    metas: true,
                    dividas: true,
                    projetos: true,
                    fixas: true,
                    limite: true,
                },
                movs: [
                    { t: "Almoço", c: "Comida", v: -4500, dt: ago(0) },
                    {
                        t: "Salário de novembro",
                        c: "Salário",
                        v: 350000,
                        dt: ago(1),
                    },
                    { t: "Internet", c: "Serviços", v: -15000, dt: ago(2) },
                    { t: "Táxi", c: "Transporte", v: -2500, dt: ago(2) },
                    { t: "Supermercado", c: "Comida", v: -38500, dt: ago(3) },
                    { t: "Mercado da rua", c: "Comida", v: -12000, dt: ago(3) },
                    { t: "Trabalho extra", c: "Extra", v: 80000, dt: ago(4) },
                    { t: "Renda da casa", c: "Casa", v: -120000, dt: ago(5) },
                ],
                metas: [
                    ["Fundo de emergência", 240000, 600000],
                    ["Viagem a Luanda", 90000, 300000],
                    ["Portátil novo", 310000, 450000],
                ],
                dividas: [
                    ["Empréstimo (Carlos)", 50000, "20 Nov"],
                    ["Cartão da loja", 35000, "15 Dez"],
                ],
                projetos: [
                    ["Obra da casa", 310000, 800000],
                    ["Curso de inglês", 45000, 90000],
                ],
                fixas: [
                    ["Renda", 120000, 1],
                    ["Internet", 15000, 10],
                    ["Electricidade", 12000, 15],
                ],
            };
            function esc(s) {
                return String(s).replace(/[&<>"]/g, function (c) {
                    return {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                    }[c];
                });
            }
            function av() {
                return S.photo
                    ? '<img src="' + S.photo + '" alt="">'
                    : "<span>" +
                          esc(S.name.trim().charAt(0).toUpperCase() || "A") +
                          "</span>";
            }
            function sv() {
                try {
                    localStorage.setItem(
                        "abprofile",
                        JSON.stringify({ n: S.name, p: S.photo }),
                    );
                } catch (x) {}
            }
            function bal() {
                return S.movs.reduce(function (a, m) {
                    return a + m.v;
                }, S.base);
            }
            function sum(f) {
                return S.movs.filter(f).reduce(function (a, m) {
                    return a + m.v;
                }, 0);
            }
            function pct(a, b) {
                return Math.min(100, Math.round((a / b) * 100));
            }
            var route = (location.hash || "#inicio").slice(1);
            function nav(r) {
                location.hash = "#" + r;
            }
            function toast(m) {
                var t = $("toast");
                t.textContent = m;
                t.classList.add("on");
                clearTimeout(toast.i);
                toast.i = setTimeout(function () {
                    t.classList.remove("on");
                }, 2000);
            }
            var CAT = {
                Comida: ["food", "#f08a3c"],
                Casa: ["home", "#4d8bf0"],
                Serviços: ["bolt", "#d9a514"],
                Transporte: ["car", "#2fb5a3"],
                Lazer: ["star", "#e0569a"],
                Saúde: ["heart", "#e2574c"],
                Salário: ["wallet", "#1f9d57"],
                Extra: ["plus", "#1f9d57"],
                Outros: ["more", "#8d8d8d"],
            };
            IC.food =
                '<path d="M8 4v6M5.500 4v4a2.500 2.500 0 005 0V4M8 12v8M17 20V4c-2 1.500-3 4-3 7 0 1 .8 2 2 2h1"/>';
            IC.bolt = '<path d="M13 3L6 13.500h5L10 21l8-10.500h-5z"/>';
            IC.car =
                '<path d="M5 16v-4l2-5h10l2 5v4zM5 16v2.500M19 16v2.500M8 13h.01M16 13h.01"/>';
            IC.star =
                '<path d="M12 4l2.400 5 5.600.8-4 3.900 1 5.500-5-2.700-5 2.700 1-5.500-4-3.900L9.600 9z"/>';
            IC.heart =
                '<path d="M12 19.500s-7-4.300-7-10A4 4 0 0112 7a4 4 0 017 2.500c0 5.700-7 10-7 10z"/>';
            IC.wallet =
                '<rect x="4" y="7" width="16" height="12" rx="3"/><path d="M4 11h16M15.500 15h1.500"/>';
            function cat(c) {
                var x = CAT[c] || CAT.Outros;
                return (
                    '<span class="circ ci" style="background:' +
                    x[1] +
                    "22;color:" +
                    x[1] +
                    '">' +
                    ic(x[0]) +
                    "</span>"
                );
            }
            function item(m) {
                return (
                    '<div class="it" data-mv="' +
                    S.movs.indexOf(m) +
                    '" style="cursor:pointer">' +
                    cat(m.c) +
                    '<div class="t">' +
                    esc(m.t) +
                    "<small>" +
                    esc(m.c) +
                    " • " +
                    fdl(m.dt) +
                    '</small></div><div class="p ' +
                    (m.v > 0 ? "g" : "n") +
                    '">' +
                    (m.v > 0 ? "+" : "−") +
                    kz(Math.abs(m.v)) +
                    "</div></div>"
                );
            }
            function head(t) {
                return (
                    '<div class="back"><button class="circ" data-go="inicio" aria-label="Voltar">' +
                    ic("back") +
                    "</button>" +
                    t +
                    "</div>"
                );
            }
            function off(m) {
                return '<div class="empty">O módulo está desativado.<br><button data-go="ajustes">Gerir módulos</button></div>';
            }
            var V = {
                inicio: function () {
                    var m = S.mod,
                        q = [
                            ["r", "plus", "Receita", 0],
                            ["d", "minus", "Despesa", 0],
                        ];
                    if (m.metas) q.push(["metas", "goal", "Metas", 0]);
                    q.push(["mais", "more", "Mais", 0]);
                    return (
                        '<div class="top"><button class="circ" id="menu" aria-label="Menu">' +
                        ic("menu") +
                        '</button><div class="rt"><button class="circ" id="bell" aria-label="Notificações">' +
                        ic("bell") +
                        '</button><button class="av" data-go="ajustes" aria-label="Perfil">' +
                        av() +
                        "</button></div></div>" +
                        "<h1>Olá, " +
                        esc(S.name) +
                        '!</h1><div class="sub">Vamos organizar o teu dinheiro.</div>' +
                        '<div class="stack' +
                        (m.salario ? " has" : "") +
                        '">' +
                        (m.salario
                            ? '<div class="sal" data-go="movimentos"><span class="mc"><i></i><i></i></span><span>Salário • 25 Nov</span></div>'
                            : "") +
                        '<div class="main"><div class="lbl">Saldo disponível</div><div class="big" id="bal" role="button">' +
                        (S.hid ? "•••••• <small>Kz</small>" : kz(bal())) +
                        "</div>" +
                        '<div class="io"><div>Receitas<b>' +
                        (S.hid
                            ? "••••"
                            : kz(
                                  sum(function (x) {
                                      return x.v > 0;
                                  }),
                              )) +
                        "</b></div><div>Despesas<b>" +
                        (S.hid
                            ? "••••"
                            : kz(
                                  -sum(function (x) {
                                      return x.v < 0;
                                  }),
                              )) +
                        '</b></div></div><div class="notch"></div></div><button class="add" data-q="d"><span>+</span>Registar</button></div>' +
                        '<div class="panel quick">' +
                        q
                            .map(function (x) {
                                return (
                                    '<button class="q' +
                                    (x[3] ? " p" : "") +
                                    '" data-q="' +
                                    x[0] +
                                    '"><span class="circ">' +
                                    ic(x[1]) +
                                    "</span>" +
                                    x[2] +
                                    "</button>"
                                );
                            })
                            .join("") +
                        "</div>" +
                        '<div class="panel"><div class="eh">Movimentos recentes<button data-go="movimentos">Ver tudo</button></div>' +
                        S.movs.slice(0, 4).map(item).join("") +
                        "</div>" +
                        '<p class="note">Protótipo com dados de exemplo</p>'
                    );
                },
                movimentos: function () {
                    return (
                        head("Movimentos") +
                        '<div class="panel" id="mf">' +
                        ctl() +
                        '</div><div id="ml">' +
                        list() +
                        "</div>"
                    );
                },
                metas: function () {
                    if (!S.mod.metas) return head("Metas") + off();
                    return (
                        head("Metas e poupanças") +
                        '<div class="panel">' +
                        S.metas
                            .map(function (g) {
                                return (
                                    '<div class="row"><div class="h"><span>' +
                                    g[0] +
                                    "</span><span>" +
                                    pct(g[1], g[2]) +
                                    "%</span></div><small>" +
                                    kz(g[1]) +
                                    " de " +
                                    kz(g[2]) +
                                    '</small><div class="bar"><i style="width:' +
                                    pct(g[1], g[2]) +
                                    '%"></i></div></div>'
                                );
                            })
                            .join("") +
                        "</div>"
                    );
                },
                dividas: function () {
                    if (!S.mod.dividas) return head("Dívidas") + off();
                    return (
                        head("Dívidas") +
                        '<div class="panel">' +
                        S.dividas
                            .map(function (d) {
                                return (
                                    '<div class="it"><span class="circ">' +
                                    ic("debt") +
                                    '</span><div class="t">' +
                                    d[0] +
                                    "<small>Vence a " +
                                    d[2] +
                                    '</small></div><div class="p n">' +
                                    kz(d[1]) +
                                    "</div></div>"
                                );
                            })
                            .join("") +
                        "</div>"
                    );
                },
                projetos: function () {
                    if (!S.mod.projetos) return head("Projetos") + off();
                    return (
                        head("Projetos") +
                        '<div class="panel">' +
                        S.projetos
                            .map(function (g) {
                                return (
                                    '<div class="row"><div class="h"><span>' +
                                    g[0] +
                                    "</span><span>" +
                                    pct(g[1], g[2]) +
                                    "%</span></div><small>Gasto " +
                                    kz(g[1]) +
                                    " de " +
                                    kz(g[2]) +
                                    '</small><div class="bar a"><i style="width:' +
                                    pct(g[1], g[2]) +
                                    '%"></i></div></div>'
                                );
                            })
                            .join("") +
                        "</div>"
                    );
                },
                fixas: function () {
                    if (!S.mod.fixas) return head("Despesas fixas") + off();
                    var t = S.fixas.reduce(function (a, f) {
                        return a + f[1];
                    }, 0);
                    return (
                        head("Despesas fixas") +
                        '<div class="panel">' +
                        S.fixas
                            .map(function (f) {
                                return (
                                    '<div class="it"><span class="circ">' +
                                    ic("fix") +
                                    '</span><div class="t">' +
                                    f[0] +
                                    "<small>Todo o dia " +
                                    f[2] +
                                    '</small></div><div class="p">' +
                                    kz(f[1]) +
                                    "</div></div>"
                                );
                            })
                            .join("") +
                        '<div class="row"><div class="h"><span>Total mensal</span><span>' +
                        kz(t) +
                        "</span></div></div></div>"
                    );
                },
                mais: function () {
                    var L = [
                        ["metas", "goal", "Metas e poupanças"],
                        ["dividas", "debt", "Dívidas"],
                        ["projetos", "proj", "Projetos"],
                        ["fixas", "fix", "Despesas fixas"],
                    ].filter(function (x) {
                        return S.mod[x[0]];
                    });
                    return (
                        head("Mais") +
                        '<div class="panel">' +
                        (L.length
                            ? L.map(function (x) {
                                  return (
                                      '<button class="it" data-go="' +
                                      x[0] +
                                      '" style="width:100%;background:none;text-align:left"><span class="circ">' +
                                      ic(x[1]) +
                                      '</span><div class="t">' +
                                      x[2] +
                                      "</div></button>"
                                  );
                              }).join("")
                            : '<div class="empty">Nenhum módulo ativo.<button data-go="ajustes">Gerir módulos</button></div>') +
                        "</div>"
                    );
                },
                ajustes: function () {
                    var L = [
                        ["salario", "Salário", "Cartão do próximo salário"],
                        ["metas", "Metas e poupanças", "Objetivos de poupança"],
                        ["dividas", "Dívidas", "Valores a pagar"],
                        ["projetos", "Projetos", "Orçamento por projeto"],
                        ["fixas", "Despesas fixas", "Contas mensais"],
                        ["limite", "Limite diário", "Gasto máximo por dia"],
                    ];
                    var dk =
                        document.documentElement.getAttribute("data-theme") ===
                        "dark";
                    return (
                        head("Ajustes") +
                        '<div class="panel pf"><label class="av big" aria-label="Alterar foto">' +
                        av() +
                        '<input type="file" accept="image/*" id="ph" hidden></label><div class="pn"><input class="in nm" id="nm" value="' +
                        esc(S.name) +
                        '" aria-label="O teu nome" maxlength="24"><small>Toca na foto para a alterar</small></div></div><div class="panel"><div class="eh">Módulos</div>' +
                        L.map(function (x) {
                            return (
                                '<div class="tg"><div>' +
                                x[1] +
                                "<small>" +
                                x[2] +
                                '</small></div><button class="sw' +
                                (S.mod[x[0]] ? " on" : "") +
                                '" data-m="' +
                                x[0] +
                                '" role="switch" aria-checked="' +
                                S.mod[x[0]] +
                                '" aria-label="' +
                                x[1] +
                                '"></button></div>'
                            );
                        }).join("") +
                        "</div>" +
                        '<div class="panel"><div class="eh">Aparência</div><div class="seg" id="th"><button data-t="light"' +
                        (dk ? "" : ' class="on"') +
                        '>Claro</button><button data-t="dark"' +
                        (dk ? ' class="on"' : "") +

                        if (r) {
                            r.textContent = r.dataset.def;
                            r.classList.remove("on");
                        }
                    },
                );
            }
            ["pointermove", "pointerdown"].forEach(function (t) {
                $("view").addEventListener(t, function (e) {
                    var sv = e.target.closest && e.target.closest(".sc svg");
                    if (!sv) {
                        if (t === "pointerdown") stReset();
                        return;
                    }
                    stSel(sv, stIdx(sv, e));
                });
            });
            $("view").addEventListener("mouseout", function (e) {
                if (
                    e.target.closest &&
                    e.target.closest(".sc svg") &&
                    !(
                        e.relatedTarget &&
                        e.relatedTarget.closest &&
                        e.relatedTarget.closest(".sc svg")
                    )
                )
                    stReset();
            });
            document.addEventListener("click", function (e) {
                var b = e.target.closest("[data-sp],[data-sk]");
                if (!b) return;
                if (b.dataset.sp) ST.n = +b.dataset.sp;
                else ST.k = b.dataset.sk;
                var v = $("view"),
                    st = v.scrollTop;
                render();
                v.scrollTop = st;
            });

            // ===== Teclado numérico próprio =====
            var KB = { t: null, held: 0, hold: 0 };
            function kbFmt(r) {
                var p = String(r).split(","),
                    i = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
                return p.length > 1 ? i + "," + p[1] : i;
            }
            function kbKey(k) {
                var el = KB.t;
                if (!el || !document.body.contains(el)) return;
                var r = el.value.replace(/\s/g, ""),
                    int = el.dataset.num === "int";
                if (k === "<") r = r.slice(0, -1);
                else if (k === ",") {
                    if (int || r.indexOf(",") >= 0) return;
                    r = (r || "0") + ",";
                } else {
                    if (int && k === "00") return;
                    var q = r.split(",");
                    if (q.length > 1) {
                        if (q[1].length + k.length > 2) return;
                    } else if (q[0].length + k.length > 9) return;
                    if (el.maxLength > 0 && r.length + k.length > el.maxLength)
                        return;
                    r =
                        k === "00" && (!r || r === "0")
                            ? "0"
                            : (r === "0" ? "" : r) + k;
                }
                el.value = kbFmt(r);
                el.dispatchEvent(new Event("input", { bubbles: true }));
                try {
                    navigator.vibrate && navigator.vibrate(6);
                } catch (x) {}
            }
            function kbOpen(el) {
                if (KB.t && KB.t !== el) KB.t.classList.remove("nf");
                KB.t = el;
                el.classList.add("nf");
                $("kb").classList.add("on");
                document.querySelector(".app").classList.add("kbo");
                setTimeout(function () {
                    try {
                        el.scrollIntoView({
                            block: "center",
                            behavior: "smooth",
                        });
                    } catch (x) {}
                }, 300);
            }
            function kbClose() {
                if (KB.t) KB.t.classList.remove("nf");
                KB.t = null;
                $("kb").classList.remove("on");
                document.querySelector(".app").classList.remove("kbo");
            }
            (function () {
                var k = document.createElement("div");
                k.className = "kb";
                k.id = "kb";
                k.setAttribute("role", "group");
                k.setAttribute("aria-label", "Teclado numérico");
                k.innerHTML = [
                    "1",
                    "2",
                    "3",
                    "<",
                    "4",
                    "5",
                    "6",
                    ",",
                    "7",
                    "8",
                    "9",
                    "0",
                    "00",
                    "ok",
                ]
                    .map(function (x) {
                        return (
                            '<button type="button" data-kk="' +
                            x +
                            '"' +
                            (x === "0"
                                ? ' class="z0"'
                                : x === "ok"
                                  ? ' class="ok"'
                                  : "") +
                            ' aria-label="' +
                            (x === "<"
                                ? "Apagar"
                                : x === ","
                                  ? "Vírgula"
                                  : x === "ok"
                                    ? "Concluir"
                                    : x) +
                            '">' +
                            (x === "<" ? ic("bksp") : x === "ok" ? "OK" : x) +
                            "</button>"
                        );
                    })
                    .join("");
                document.querySelector(".app").appendChild(k);
                k.addEventListener("pointerdown", function (e) {
                    e.preventDefault();
                    var b = e.target.closest('[data-kk="<"]');
                    if (!b) return;
                    KB.held = 0;
                    KB.hold = setTimeout(function () {
                        KB.held = 1;
                        KB.hold = setInterval(function () {
                            kbKey("<");
                        }, 70);
                    }, 430);
                });
                ["pointerup", "pointerleave", "pointercancel"].forEach(
                    function (t) {
                        k.addEventListener(t, function () {
                            clearTimeout(KB.hold);
                            clearInterval(KB.hold);
                            KB.hold = 0;
                        });
                    },
                );
                k.addEventListener("click", function (e) {
                    var b = e.target.closest("[data-kk]");
                    if (!b) return;
                    if (KB.held) {
                        KB.held = 0;
                        return;
                    }
                    var v = b.dataset.kk;
                    if (v === "ok") kbClose();
                    else kbKey(v);
                });
            })();
            document.addEventListener("focusin", function (e) {
                var t = e.target;
                if (t.matches && t.matches("[data-num]")) kbOpen(t);
                else if (KB.t && !(t.closest && t.closest(".kb"))) kbClose();
            });
            document.addEventListener("click", function (e) {
                var t = e.target,
                    n = t.closest && t.closest("[data-num]");
                if (n) {
                    kbOpen(n);
                    return;
                }
                if (KB.t && !(t.closest && t.closest(".kb"))) kbClose();
            });
            document.addEventListener("keydown", function (e) {
                if (!KB.t) return;
                var k = e.key;
                if (/^\d$/.test(k)) kbKey(k);
                else if (k === "," || k === ".") kbKey(",");
                else if (k === "Backspace") kbKey("<");
                else if (k === "Enter") kbClose();
                else return;
                e.preventDefault();
            });
            new MutationObserver(function () {
                if (
                    KB.t &&
                    (!document.body.contains(KB.t) ||
                        !document.querySelector(".ov.on,.dr.on,.onb"))
                )
                    kbClose();
            }).observe(document.querySelector(".app"), {
                subtree: true,
                childList: true,
                attributes: true,
                attributeFilter: ["class"],
            });
            var os1 = openSh;
            openSh = function (k) {
                os1(k);
                setTimeout(function () {
                    if ($("ov").classList.contains("on")) kbOpen($("vl"));
                }, 320);
            };

            render();
            try {
                if (!localStorage.getItem("abonb")) onb();
            } catch (x) {
                onb();
            }
        </script>
    </body>
</html>
