<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Novo movimento</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>body{margin:0}button{font-family:inherit;cursor:pointer;color:inherit}</style><style>html,body{margin:0;background:#050918}main>div{margin:0 auto}</style></head><body><main>
<div style="position:relative;width:100%;max-width:390px;height:100vh;min-height:844px;box-sizing:border-box;background:radial-gradient(70% 22% at 85% 6%,rgba(190,215,255,.5),transparent),linear-gradient(180deg,#3F78F2 0%,#1B3A9C 14%,#0B1538 34%,#070C24 62%);color:#fff;font-family:'DM Sans',system-ui,sans-serif;display:flex;flex-direction:column;padding:56px 16px 0;font-variant-numeric:tabular-nums">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:20px;font-weight:700">Novo movimento</div><button aria-label="Fechar" style="width:44px;height:44px;border-radius:22px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px">×</button></div>
<div style="display:flex;background:rgba(255,255,255,.12);border-radius:14px;padding:4px;font-size:14px"><button style="flex:1;height:36px;border:0;border-radius:10px;background:#3C74F5;font-weight:700">Despesa</button><button style="flex:1;height:36px;border:0;background:none;color:#9AA6C9">Receita</button></div>
<div style="text-align:center;margin:18px 0 10px;font-size:52px;font-weight:700;letter-spacing:-1px">1 800 <span style="font-size:22px;color:#9AA6C9;font-weight:500">Kz</span></div>
<div style="background:linear-gradient(160deg,#1A2654,#101839);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);border-radius:20px;padding:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:16px">táxi</span><span style="font-size:12px;font-weight:500;padding:4px 10px;border-radius:12px;background:rgba(60,116,245,.24);color:#9CBEFF">Transporte · lembrado</span></div>
<div style="font-size:13px;color:#9AA6C9;margin:14px 0 8px">Rápidos · um toque guarda</div><div style="display:flex;gap:8px;overflow:hidden">
<button style="height:36px;padding:0 14px;border-radius:18px;border:0;background:#3C74F5;color:#fff;font-size:14px;white-space:nowrap">↻ Almoço 2 500</button>
<button style="height:36px;padding:0 14px;border-radius:18px;border:0;background:linear-gradient(160deg,#1A2654,#101839);color:#fff;font-size:14px;white-space:nowrap">Táxi 1 800</button>
<button style="height:36px;padding:0 14px;border-radius:18px;border:0;background:linear-gradient(160deg,#1A2654,#101839);color:#fff;font-size:14px;white-space:nowrap">Pão 500</button>
</div>
<div style="display:flex;gap:8px;margin:12px 0 14px">
<button style="height:36px;padding:0 14px;border-radius:18px;border:0;background:#3C74F5;color:#fff;font-size:14px;white-space:nowrap">Hoje</button>
<button style="height:36px;padding:0 14px;border-radius:18px;border:0;background:linear-gradient(160deg,#1A2654,#101839);color:#fff;font-size:14px;white-space:nowrap">Ontem</button>
<button style="height:36px;padding:0 14px;border-radius:18px;border:0;background:linear-gradient(160deg,#1A2654,#101839);color:#fff;font-size:14px;white-space:nowrap">Outro dia</button>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">1</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">2</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">3</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">4</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">5</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">6</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">7</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">8</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">9</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">000</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">0</button>
<button style="height:56px;border-radius:14px;border:0;background:linear-gradient(160deg,#1A2654,#101839);font-size:20px;font-weight:500">⌫</button>
</div><div style="flex:1"></div>
<button style="height:56px;border-radius:28px;border:0;background:linear-gradient(160deg,#6B9BFF,#2F5FE0);color:#fff;font-size:16px;font-weight:500;box-shadow:0 8px 24px rgba(60,116,245,.4),inset 0 1px 0 rgba(255,255,255,.4);margin-bottom:32px">Guardar</button></div>
</main></body></html>
