<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Salário</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        color: inherit;
      }
    </style>
    <style>
      html,
      body {
        margin: 0;
        background: #050918;
      }
      main > div {
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main>
      <div
        style="
          position: relative;
          width: 100%;
          max-width: 390px;
          height: 100vh;
          min-height: 844px;
          box-sizing: border-box;
          background:
            radial-gradient(
              70% 22% at 85% 6%,
              rgba(190, 215, 255, 0.5),
              transparent
            ),
            linear-gradient(
              180deg,
              #3f78f2 0%,
              #1b3a9c 14%,
              #0b1538 34%,
              #070c24 62%
            );
          color: #fff;
          font-family: &quot;DM Sans&quot;, system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          padding: 56px 16px 0;
          font-variant-numeric: tabular-nums;
        "
      >
        <button
          style="
            background: none;
            border: 0;
            font-size: 15px;
            color: #9aa6c9;
            text-align: left;
            padding: 0 0 8px;
          "
        >
          ‹ Início
        </button>
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
          "
        >
          <div
            style="font-size: 28px; font-weight: 700; letter-spacing: -0.5px"
          >
            Salário
          </div>
        </div>
        <div
          style="
            background: linear-gradient(160deg, #1a2654, #101839);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
          "
        >
          <div style="font-size: 13px; color: #9aa6c9">Valor mensal</div>
          <div
            style="font-size: 36px; font-weight: 700; letter-spacing: -0.5px"
          >
            150 000
            <span style="font-size: 20px; color: #9aa6c9; font-weight: 500"
              >Kz</span
            >
          </div>
        </div>
        <div
          style="
            background: linear-gradient(160deg, #1a2654, #101839);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
          "
        >
          <div style="font-size: 13px; color: #9aa6c9; margin-bottom: 12px">
            Dia em que cai
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <button
              style="
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: 0;
                font-size: 15px;
                background: rgba(255, 255, 255, 0.08);
                color: #fff;
              "
            >
              1
            </button>
            <button
              style="
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: 0;
                font-size: 15px;
                background: rgba(255, 255, 255, 0.08);
                color: #fff;
              "
            >
              5
            </button>
            <button
              style="
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: 0;
                font-size: 15px;
                background: rgba(255, 255, 255, 0.08);
                color: #fff;
              "
            >
              10
            </button>
            <button
              style="
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: 0;
                font-size: 15px;
                background: rgba(255, 255, 255, 0.08);
                color: #fff;
              "
            >
              15
            </button>
            <button
              style="
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: 0;
                font-size: 15px;
                background: rgba(255, 255, 255, 0.08);
                color: #fff;
              "
            >
              20
            </button>
            <button
              style="
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: 0;
                font-size: 15px;
                background: #3c74f5;
                color: #fff;
                font-weight: 700;
              "
            >
              25
            </button>
            <button
              style="
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: 0;
                font-size: 15px;
                background: rgba(255, 255, 255, 0.08);
                color: #fff;
              "
            >
              28
            </button>
            <button
              style="
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: 0;
                font-size: 15px;
                background: rgba(255, 255, 255, 0.08);
                color: #fff;
              "
            >
              30
            </button>
          </div>
        </div>
        <div
          style="
            background: linear-gradient(160deg, #1a2654, #101839);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            padding: 6px 16px;
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              gap: 12px;
              padding: 10px 0;
            "
          >
            <div style="flex: 1">
              <div style="font-size: 15px; font-weight: 500">
                Ajustar ao dia útil
              </div>
              <div style="font-size: 13px; color: #9aa6c9">
                Se cair ao fim de semana, conta na sexta
              </div>
            </div>
            <button
              role="switch"
              aria-checked="true"
              aria-label="Ajustar ao dia útil"
              style="
                position: relative;
                width: 48px;
                height: 28px;
                border-radius: 14px;
                border: 0;
                background: #5b8dff;
                flex: none;
              "
            >
              <span
                style="
                  position: absolute;
                  top: 3px;
                  right: 3px;
                  width: 22px;
                  height: 22px;
                  border-radius: 11px;
                  background: #fff;
                "
              ></span>
            </button>
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 12px;
              padding: 10px 0;
            "
          >
            <div style="flex: 1">
              <div style="font-size: 15px; font-weight: 500">
                Lançar como receita
              </div>
              <div style="font-size: 13px; color: #9aa6c9">
                Regista nos movimentos no dia certo
              </div>
            </div>
            <button
              role="switch"
              aria-checked="true"
              aria-label="Lançar como receita"
              style="
                position: relative;
                width: 48px;
                height: 28px;
                border-radius: 14px;
                border: 0;
                background: #5b8dff;
                flex: none;
              "
            >
              <span
                style="
                  position: absolute;
                  top: 3px;
                  right: 3px;
                  width: 22px;
                  height: 22px;
                  border-radius: 11px;
                  background: #fff;
                "
              ></span>
            </button>
          </div>
        </div>
        <div
          style="
            background: rgba(60, 116, 245, 0.24);
            color: #9cbeff;
            border-radius: 20px;
            padding: 16px;
          "
        >
          <div style="font-size: 13px">Próximo salário</div>
          <div style="font-size: 18px; font-weight: 700; margin-top: 2px">
            Sexta, 23 out · faltam 9 dias
          </div>
          <div style="font-size: 13px; margin-top: 2px">
            Dia 25 cai a um domingo
          </div>
        </div>
        <div style="flex: 1"></div>
        <button
          style="
            height: 56px;
            border-radius: 28px;
            border: 0;
            background: linear-gradient(160deg, #6b9bff, #2f5fe0);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            box-shadow:
              0 8px 24px rgba(60, 116, 245, 0.4),
              inset 0 1px 0 rgba(255, 255, 255, 0.4);
            margin-bottom: 32px;
          "
        >
          Guardar
        </button>
      </div>
    </main>
  </body>
</html>
